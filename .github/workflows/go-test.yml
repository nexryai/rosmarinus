name: Go Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: salvia/package.json

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: salvia/pnpm-lock.yaml

      - name: Build Salvia assets
        run: pnpm --dir salvia install --frozen-lockfile && pnpm --dir salvia build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        env:
          TIMELINE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          TIMELINE_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -count=1 ./...
