name: rosmarinus

services:
  rosmarinus:
    image: ghcr.io/nexryai/rosmarinus:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    environment:
      HOST: localhost:3000
      PUBLIC_URL: http://localhost:3000
      HTTP_ADDR: :3000
      MONGO_URI: mongodb://rosmarinus:dummy-rosmarinus-password@mongo:27017/rosmarinus?authSource=rosmarinus
      MONGO_DATABASE: rosmarinus
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: dummy-redis-password
      REDIS_DB: "0"
      SESSION_COOKIE_NAME: dummy_rosmarinus_session
      SESSION_COOKIE_SECURE: "false"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Dummy Rosmarinus
      WEBAUTHN_ALLOWED_ORIGINS: http://localhost:3000
      RUN_HTTP: "true"
      RUN_WORKERS: "true"
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: rosmarinus
      OBJECT_STORAGE_ACCESS_KEY_ID: rosmarinus
      OBJECT_STORAGE_SECRET_ACCESS_KEY: dummy-object-storage-password
      OBJECT_STORAGE_PUBLIC_URL: http://localhost:9000/rosmarinus
      OBJECT_STORAGE_PATH_STYLE: "true"
    ports:
      - "3000:3000"

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dummy-mongo-root-password
      ROSMARINUS_MONGO_DATABASE: rosmarinus
      ROSMARINUS_MONGO_USERNAME: rosmarinus
      ROSMARINUS_MONGO_PASSWORD: dummy-rosmarinus-password
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "dummy-mongo-root-password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dummy-redis-password"]
    environment:
      REDISCLI_AUTH: dummy-redis-password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rosmarinus
      MINIO_ROOT_PASSWORD: dummy-object-storage-password
    volumes:
      - object-storage-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://object-storage:9000 rosmarinus dummy-object-storage-password && mc mb --ignore-existing local/rosmarinus && mc anonymous set download local/rosmarinus"]

volumes:
  mongo-data:
  redis-data:
  object-storage-data:
