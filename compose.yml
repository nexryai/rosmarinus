name: rosmarinus

services:
  rosmarinus:
    image: ghcr.io/nexryai/rosmarinus:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: localhost:3000
      PUBLIC_URL: http://localhost:3000
      HTTP_ADDR: :3000
      MONGO_URI: mongodb://rosmarinus:dummy-rosmarinus-password@mongo:27017/rosmarinus?authSource=rosmarinus
      MONGO_DATABASE: rosmarinus
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: dummy-redis-password
      REDIS_DB: "0"
      SESSION_COOKIE_NAME: dummy_rosmarinus_session
      SESSION_COOKIE_SECURE: "false"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Dummy Rosmarinus
      WEBAUTHN_ALLOWED_ORIGINS: http://localhost:3000
      RUN_HTTP: "true"
      RUN_WORKERS: "true"
    ports:
      - "3000:3000"

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dummy-mongo-root-password
      ROSMARINUS_MONGO_DATABASE: rosmarinus
      ROSMARINUS_MONGO_USERNAME: rosmarinus
      ROSMARINUS_MONGO_PASSWORD: dummy-rosmarinus-password
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "dummy-mongo-root-password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dummy-redis-password"]
    environment:
      REDISCLI_AUTH: dummy-redis-password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
