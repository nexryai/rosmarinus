server {
	listen 80;
	listen [::]:80;
	server_name rosmarinus.test;

	location / {
		return 301 https://$server_name$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name rosmarinus.test;

	ssl_session_timeout 1d;
	ssl_session_cache shared:ssl_session_cache:10m;
	ssl_session_tickets off;

	ssl_trusted_certificate /etc/nginx/certificates/rootCA.crt;
	ssl_certificate /etc/nginx/certificates/rosmarinus.test.crt;
	ssl_certificate_key /etc/nginx/certificates/rosmarinus.test.key;

	ssl_protocols TLSv1.2 TLSv1.3;
	client_max_body_size 80m;

	location / {
		proxy_pass http://rosmarinus:8080;
		proxy_set_header Host $host;
		proxy_http_version 1.1;
		proxy_redirect off;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}
}
