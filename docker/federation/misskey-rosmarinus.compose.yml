services:
  misskey.a.test:
    healthcheck:
      start_period: 5m
      interval: 5s
      timeout: 10s
      retries: 60

  misskey.b.test:
    healthcheck:
      start_period: 5m
      interval: 5s
      timeout: 10s
      retries: 60

  rosmarinus:
    image: ${ROSMARINUS_IMAGE:-rosmarinus:test}
    depends_on:
      rosmarinus.mongo:
        condition: service_healthy
      rosmarinus.redis:
        condition: service_healthy
    environment:
      HOST: rosmarinus.test
      PUBLIC_URL: https://rosmarinus.test
      HTTP_ADDR: :8080
      MONGO_URI: mongodb://rosmarinus:rosmarinus-fixture-only@rosmarinus.mongo:27017/rosmarinus_federation?authSource=rosmarinus_federation
      MONGO_DATABASE: rosmarinus_federation
      REDIS_ADDR: rosmarinus.redis:6379
      RUN_HTTP: "true"
      RUN_WORKERS: "true"
      LOCAL_ACTOR_USERNAME: relay
      LOCAL_ACTOR_TYPE: Service
      USER_AGENT: rosmarinus-federation-test/0.0.1
    volumes:
      - type: bind
        source: ./certificates/rootCA.crt
        target: /etc/ssl/certs/rosmarinus-test-root-ca.crt
        read_only: true
    networks:
      - internal_network

  rosmarinus.test:
    image: nginx:1.30
    depends_on:
      - rosmarinus
    volumes:
      - type: bind
        source: ../../../../docker/federation/nginx/rosmarinus.test.conf
        target: /etc/nginx/conf.d/rosmarinus.test.conf
        read_only: true
      - type: bind
        source: ./certificates/rootCA.crt
        target: /etc/nginx/certificates/rootCA.crt
        read_only: true
      - type: bind
        source: ./certificates/rosmarinus.test.crt
        target: /etc/nginx/certificates/rosmarinus.test.crt
        read_only: true
      - type: bind
        source: ./certificates/rosmarinus.test.key
        target: /etc/nginx/certificates/rosmarinus.test.key
        read_only: true
    healthcheck:
      test: service nginx status
      interval: 5s
      retries: 20
    networks:
      - internal_network

  rosmarinus.mongo:
    image: mongo:8
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-fixture-only
      ROSMARINUS_MONGO_DATABASE: rosmarinus_federation
      ROSMARINUS_MONGO_USERNAME: rosmarinus
      ROSMARINUS_MONGO_PASSWORD: rosmarinus-fixture-only
      SALVIA_MONGO_USERNAME: salvia
      SALVIA_MONGO_PASSWORD: salvia-fixture-only
    volumes:
      - type: bind
        source: ../../../../docker/mongo/init-users.js
        target: /docker-entrypoint-initdb.d/10-users.js
        read_only: true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "root-fixture-only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal_network

  rosmarinus.redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal_network

  rosmarinus-federation-test:
    image: golang:1.26-bookworm
    profiles: ["rosmarinus-test"]
    depends_on:
      rosmarinus.test:
        condition: service_healthy
      a.test:
        condition: service_healthy
      rosmarinus.mongo:
        condition: service_healthy
      rosmarinus.redis:
        condition: service_healthy
    environment:
      ROSMARINUS_FEDERATION_TEST: "1"
      SSL_CERT_FILE: /certificates/rootCA.crt
      MONGO_URI: mongodb://rosmarinus:rosmarinus-fixture-only@rosmarinus.mongo:27017/rosmarinus_federation?authSource=rosmarinus_federation
      MONGO_DATABASE: rosmarinus_federation
      REDIS_ADDR: rosmarinus.redis:6379
      GOCACHE: /tmp/go-cache
      GOMODCACHE: /tmp/go-mod-cache
    volumes:
      - type: bind
        source: ../../../../
        target: /workspace
        read_only: true
      - type: bind
        source: ./certificates/rootCA.crt
        target: /certificates/rootCA.crt
        read_only: true
    working_dir: /workspace
    command: go test -v -count=1 ./test/federation
    networks:
      - external_network
      - internal_network

networks:
  internal_network:
