services:
  rosmarinus:
    image: ${ROSMARINUS_IMAGE:-rosmarinus:test}
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      rosmarinus-mongo:
        condition: service_healthy
      rosmarinus-redis:
        condition: service_healthy
    environment:
      HOST: ${ROSMARINUS_HOST:-127.0.0.1:8080}
      PUBLIC_URL: ${ROSMARINUS_PUBLIC_URL:-http://127.0.0.1:8080}
      HTTP_ADDR: :3000
      MONGO_URI: mongodb://rosmarinus:rosmarinus-fixture-only@rosmarinus-mongo:27017/rosmarinus_federation?authSource=rosmarinus_federation
      MONGO_DATABASE: rosmarinus_federation
      REDIS_ADDR: rosmarinus-redis:6379
      RUN_HTTP: "true"
      RUN_WORKERS: "true"
      LOCAL_ACTOR_USERNAME: relay
      LOCAL_ACTOR_TYPE: Service
    ports:
      - "${ROSMARINUS_HTTP_PORT:-8080}:3000"

  rosmarinus-mongo:
    image: mongo:8
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-fixture-only
      ROSMARINUS_MONGO_DATABASE: rosmarinus_federation
      ROSMARINUS_MONGO_USERNAME: rosmarinus
      ROSMARINUS_MONGO_PASSWORD: rosmarinus-fixture-only
    volumes:
      - ../mongo/init-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "root-fixture-only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rosmarinus-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
