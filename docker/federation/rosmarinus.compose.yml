services:
  rosmarinus:
    image: ${ROSMARINUS_IMAGE:-rosmarinus:test}
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      rosmarinus-mongo:
        condition: service_healthy
      rosmarinus-redis:
        condition: service_healthy
      rosmarinus-object-storage-init:
        condition: service_completed_successfully
    environment:
      HOST: ${ROSMARINUS_HOST:-127.0.0.1:8080}
      PUBLIC_URL: ${ROSMARINUS_PUBLIC_URL:-http://127.0.0.1:8080}
      HTTP_ADDR: :3000
      MONGO_URI: mongodb://rosmarinus:rosmarinus-fixture-only@rosmarinus-mongo:27017/rosmarinus_federation?authSource=rosmarinus_federation
      MONGO_DATABASE: rosmarinus_federation
      REDIS_ADDR: rosmarinus-redis:6379
      RUN_HTTP: "true"
      RUN_WORKERS: "true"
      LOCAL_ACTOR_USERNAME: relay
      LOCAL_ACTOR_TYPE: Service
      OBJECT_STORAGE_ENDPOINT: http://rosmarinus-object-storage:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: rosmarinus
      OBJECT_STORAGE_ACCESS_KEY_ID: rosmarinus
      OBJECT_STORAGE_SECRET_ACCESS_KEY: rosmarinus-fixture-only
      OBJECT_STORAGE_PUBLIC_URL: http://127.0.0.1:9000/rosmarinus
      OBJECT_STORAGE_PATH_STYLE: "true"
    ports:
      - "${ROSMARINUS_HTTP_PORT:-8080}:3000"

  rosmarinus-mongo:
    image: mongo:8
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-fixture-only
      ROSMARINUS_MONGO_DATABASE: rosmarinus_federation
      ROSMARINUS_MONGO_USERNAME: rosmarinus
      ROSMARINUS_MONGO_PASSWORD: rosmarinus-fixture-only
    volumes:
      - ../mongo/init-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "root-fixture-only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rosmarinus-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rosmarinus-object-storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: rosmarinus
      MINIO_ROOT_PASSWORD: rosmarinus-fixture-only
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  rosmarinus-object-storage-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      rosmarinus-object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://rosmarinus-object-storage:9000 rosmarinus rosmarinus-fixture-only && mc mb --ignore-existing local/rosmarinus && mc anonymous set download local/rosmarinus"]
